[project]
name = "us-datacentres"
version = "0.1.0"
description = "Off grid data centre model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "branca>=0.8.2",
    "cdsapi>=0.7.0",
    "dash>=4.0.0",
    "dash-bootstrap-components>=2.0.4",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.7",
    "plotly>=6.4.0",
    "pvlib>=0.13.1",
    "pypsa>=1.0.7",
    "python-dotenv>=1.0.0",
    "rasterio>=1.4.3",
    "requests>=2.32.5",
    "requests-aws4auth>=1.3.1",
    "scipy>=1.11.0",
    "streamlit>=1.51.0",
    "streamlit-folium>=0.25.3",
    "xarray>=2024.1.0",
]

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
