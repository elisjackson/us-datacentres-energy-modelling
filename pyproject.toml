[project]
name = "off-grid-datacentres"
version = "0.1.0"
description = "Off-grid data centre energy model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.0.0",
    "dash-bootstrap-components>=2.0.4",
    "geopandas>=1.1.1",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "plotly>=6.4.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "requests-aws4auth>=1.3.1",
]

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
